[project]
name = "anthropic-cookbook"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "anthropic>=0.71.0",
    "ipykernel>=7.1.0",
    "notebook>=7.4.7",
    "numpy>=2.3.4",
    "pandas>=2.3.3",
    "jupyter>=1.1.1",
    "rich>=14.2.0",
    "python-dotenv>=1.2.1",
    "voyageai>=0.3.5",
    "python-telegram-bot>=22.7",
    "httpx>=0.28.1",
    "google-api-python-client>=2.193.0",
    "google-auth-httplib2>=0.3.0",
    "google-auth-oauthlib>=1.3.0",
    "google-generativeai>=0.8.6",
    "firebase-admin>=7.3.0",
    "playwright>=1.58.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.14.2",
    "pytest>=8.3.3",
    "nbval>=0.11.0",
    "pre-commit>=3.8.0",
    "nbconvert>=7.16.0",
    "pyyaml>=6.0.3",
    "tox>=4.32.0",
    "tox-uv>=1.29.0",
]

[tool.hatch.build.targets.wheel]
packages = ["anthropic_cookbook"]  # Dummy package for build system

[tool.ruff]
line-length = 100
target-version = "py311"
extend-include = ["*.ipynb"]  # Ruff v0.6.0+ includes notebooks by default, but explicit is better

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "S", "B"]
ignore = [
    "E501",   # line too long
    "S101",   # assert used (ok in tests)
    "S301",   # pickle usage ok for local data in cookbooks
    "S311",   # pseudo-random generators ok for non-crypto
    "S603",   # subprocess with list args is the safe pattern (not untrusted input)
    "S607",   # partial executable paths ok for known commands (docker-compose, etc.)
    "S608",   # SQL string construction ok for demo/educational code
    "S104",   # binding to all interfaces ok for demo webhook servers
    "N806",   # variable in function should be lowercase (allow for API responses)
]

[tool.ruff.lint.per-file-ignores]
# Notebooks have different conventions than regular Python files
"*.ipynb" = [
    "E402",   # imports mid-file
    "F811",   # redefinitions (common in notebooks)
    "N803",   # argument name should be lowercase
    "N806",   # variable in function should be lowercase
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (requires notebook execution)",
    "integration: marks tests that require a real browser (Chromium must be installed)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]


name = "particle-chat-v42"
main = "src/index.ts"
compatibility_date = "2026-01-26"
compatibility_flags = ["nodejs_compat"]

# Environment variables
# Note: Secrets like ANTHROPIC_API_KEY should be set using: wrangler secret put ANTHROPIC_API_KEY
[vars]
NODE_ENV = "production"

# Development environment
[env.development]
name = "particle-chat-v42-dev"
[env.development.vars]
NODE_ENV = "development"

# Production environment
[env.production]
name = "particle-chat-v42-production"
[env.production.vars]
NODE_ENV = "production"
